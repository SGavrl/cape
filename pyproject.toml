[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cape-ai"
version = "0.1.0"
description = "Calibrated Assertion Probability Estimator"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "sentencepiece",
    "protobuf",
]

[tool.setuptools.packages.find]
include = ["cape*"]
